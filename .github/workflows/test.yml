name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python3 -m unittest discover -s tests -v
      - run: lua5.1 tests/test_screen_adapter.lua
      - run: sh -n router/install.sh router/rollback.sh router/speedify-control router/speedify-screen.init
